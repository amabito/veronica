[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veronica"
version = "0.1.0"
description = "Execution OS for LLM systems — built on veronica-core"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "veronica-core>=0.10.0",
]

[tool.uv.sources]
veronica-core = { path = "../veronica-core", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veronica"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
