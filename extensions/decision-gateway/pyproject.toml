[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veronica-decision-gateway"
version = "0.1.0a1"
readme = "README.md"
description = "Optional application-side decision routing for VERONICA; never an authorization authority."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
kernel = ["veronica-core>=3.10.0,<4"]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
