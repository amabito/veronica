<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERONICA -- Policies</title>
  <link rel="stylesheet" href="/ui/static/css/style.css">
  <style>
    .policy-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      align-items: start;
    }
    .policy-row.selected td {
      background: rgba(59, 130, 246, 0.12) !important;
    }
    @media (max-width: 900px) {
      .policy-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a class="nav-brand" href="/ui/">VERONICA</a>
    <ul class="nav-links">
      <li><a href="/ui/">Dashboard</a></li>
      <li><a href="/ui/events">Events</a></li>
      <li><a href="/ui/policies" class="active">Policies</a></li>
      <li><a href="/ui/rollouts">Rollouts</a></li>
      <li><a href="/ui/tenants">Tenants</a></li>
      <li><a href="/ui/replay">Replay</a></li>
    </ul>
    <span id="policy-total" style="margin-left:auto;font-size:12px;color:var(--text-muted);"></span>
  </nav>

  <!-- Main -->
  <main class="main">
    <h1 class="page-title">Policy Editor</h1>

    <div class="policy-layout">
      <!-- Policy List -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Policies</span>
          <span class="refresh-indicator">Click a row to edit</span>
        </div>
        <div class="card-body">
          <table>
            <thead>
              <tr>
                <th>Chain ID</th>
                <th>On Exceed</th>
                <th>Ceiling USD</th>
                <th>Priority</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="policy-tbody">
              <tr><td colspan="5" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Editor Panel -->
      <div id="editor-panel" class="card" style="display:none;">
        <div class="card-header">
          <span class="card-title" id="editor-title">Edit Policy</span>
        </div>
        <div class="card-body" style="padding:20px;">
          <input type="hidden" id="field-version">

          <div class="form-group">
            <label class="form-label" for="field-ceiling-usd">Ceiling USD *</label>
            <input id="field-ceiling-usd" class="form-input" type="number" step="0.0001" min="0" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="field-on-exceed">On Exceed *</label>
            <select id="field-on-exceed" class="form-select">
              <option value="halt">halt</option>
              <option value="degrade">degrade</option>
              <option value="queue">queue</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="field-priority">Priority (0-100)</label>
            <input id="field-priority" class="form-input" type="number" min="0" max="100">
          </div>

          <div class="form-group">
            <label class="form-label" for="field-ceiling-tokens">Ceiling Tokens Out</label>
            <input id="field-ceiling-tokens" class="form-input" type="number" min="0" placeholder="optional">
          </div>

          <div class="form-group">
            <label class="form-label" for="field-ceiling-steps">Ceiling Steps</label>
            <input id="field-ceiling-steps" class="form-input" type="number" min="0" placeholder="optional">
          </div>

          <div class="form-group">
            <label class="form-label" for="field-fallback-model">Fallback Model</label>
            <input id="field-fallback-model" class="form-input" type="text" placeholder="e.g. gpt-3.5-turbo">
          </div>

          <div class="form-group">
            <label class="form-label" for="field-timeout-ms">Timeout (ms)</label>
            <input id="field-timeout-ms" class="form-input" type="number" min="0" placeholder="optional">
          </div>

          <div style="display:flex;gap:8px;margin-top:8px;">
            <button id="save-btn" class="btn btn-primary" style="flex:1;">Save</button>
            <button id="cancel-btn" class="btn" style="background:var(--surface);color:var(--text-muted);border:1px solid var(--border);">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- API Key Modal -->
  <div id="apikey-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-title">Enter API Key</div>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">
        Provide your X-Veronica-Key to access the policy editor.
      </p>
      <div class="form-group">
        <label class="form-label" for="apikey-input">API Key</label>
        <input
          id="apikey-input"
          class="form-input"
          type="password"
          placeholder="vk-..."
          autocomplete="off"
        >
      </div>
      <div class="modal-actions">
        <button id="apikey-save" class="btn btn-primary">Connect</button>
      </div>
    </div>
  </div>

  <script src="/ui/static/js/policies.js"></script>
</body>
</html>
